<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>QuickCart</title>

  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --text: #111111;
      --muted: #707070;
      --border: #e8e8e8;
      --soft: #f6f6f6;
      --button: #111111;
      --button-text: #ffffff;
      --green: #12804c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Inter",
        "Segoe UI",
        sans-serif;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;
    }

    .title {
      font-size: 17px;
      font-weight: 750;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product {
      display: grid;
      grid-template-columns:
        72px minmax(0, 1fr) auto;

      gap: 11px;
      align-items: center;

      padding: 8px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--card);
    }

    .image {
      width: 72px;
      height: 72px;

      overflow: hidden;
      border-radius: 11px;

      background: var(--soft);
    }

    .image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      display: block;
    }

    .details {
      min-width: 0;
    }

    .name {
      font-size: 14px;
      line-height: 1.25;
      font-weight: 700;
    }

    .brand {
      margin-top: 2px;

      color: var(--muted);
      font-size: 11px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;
      margin-top: 5px;

      color: var(--muted);
      font-size: 11px;
    }

    .rating {
      color: #d09500;
      font-weight: 700;
    }

    .pricing {
      display: flex;
      align-items: center;

      gap: 6px;
      margin-top: 5px;
    }

    .price {
      font-size: 15px;
      font-weight: 800;
    }

    .mrp {
      font-size: 11px;
      color: var(--muted);

      text-decoration: line-through;
    }

    .discount {
      color: var(--green);
      font-size: 10px;
      font-weight: 700;
    }

    button {
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .add {
      padding: 8px 12px;

      border-radius: 9px;

      background: var(--button);
      color: var(--button-text);

      font-size: 12px;
      font-weight: 700;
    }

    .add:disabled {
      opacity: .5;
      cursor: default;
    }

    .cart {
      margin-top: 14px;

      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 16px;

      background: var(--soft);
    }

    .cart-title {
      font-size: 14px;
      font-weight: 750;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;

      margin-top: 7px;

      color: var(--muted);
      font-size: 12px;
    }

    .total-row {
      display: flex;
      justify-content: space-between;

      margin-top: 9px;

      font-size: 16px;
      font-weight: 800;
    }

    .pay {
      width: 100%;

      margin-top: 12px;
      padding: 11px;

      border-radius: 10px;

      background: #111;
      color: white;

      font-size: 13px;
      font-weight: 750;
    }

    .pay:disabled {
      opacity: .5;
      cursor: default;
    }

    .empty {
      padding: 28px;

      color: var(--muted);

      text-align: center;
      font-size: 13px;
    }

    .toast {
      position: fixed;

      left: 50%;
      bottom: 12px;

      transform: translateX(-50%);

      padding: 8px 13px;

      border-radius: 999px;

      background: #111;
      color: white;

      font-size: 12px;
      font-weight: 650;

      opacity: 0;
      pointer-events: none;

      transition: opacity .15s ease;
    }

    .toast.visible {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="header">
    <div
      id="title"
      class="title"
    >
      QuickCart
    </div>

    <div
      id="count"
      class="count"
    >
      0 products
    </div>
  </div>

  <div
    id="products"
    class="products"
  ></div>

  <div
    id="cart"
    class="cart"
    style="display:none"
  >
    <div class="cart-title">
      Your Cart
    </div>

    <div
      id="cartItems"
    ></div>

    <div class="summary-row">
      <span>Subtotal</span>
      <span id="subtotal">
        ₹0
      </span>
    </div>

    <div class="summary-row">
      <span>Delivery</span>
      <span id="delivery">
        ₹0
      </span>
    </div>

    <div class="total-row">
      <span>Total</span>
      <span id="total">
        ₹0
      </span>
    </div>

    <button
      id="payButton"
      class="pay"
      disabled
    >
      Pay ₹0
    </button>
  </div>

  <div
    id="toast"
    class="toast"
  ></div>


<script>

function output() {
  return window.openai?.toolOutput || {};
}


function products() {
  const value = output().products;

  return Array.isArray(value)
    ? value
    : [];
}


function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


let toastTimer;


function showToast(message) {

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "visible"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {
        element.classList.remove(
          "visible"
        );
      },
      1800
    );
}


async function addToCart(productId) {

  if (
    !window.openai ||
    typeof window.openai.callTool !==
      "function"
  ) {
    showToast(
      "Tool bridge unavailable"
    );

    return;
  }

  try {

    const result =
      await window.openai.callTool(
        "add_to_cart",
        {
          product_id: productId,
          quantity: 1
        }
      );

    if (
      result?.isError ||
      result?.success === false
    ) {
      showToast(
        result?.error ||
        "Could not add item"
      );

      return;
    }

    showToast(
      "Added to cart"
    );

    await refreshCart();

  } catch (error) {

    console.error(error);

    showToast(
      "Could not add item"
    );
  }
}


async function refreshCart() {

  if (
    !window.openai ||
    typeof window.openai.callTool !==
      "function"
  ) {
    return;
  }

  try {

    const result =
      await window.openai.callTool(
        "get_cart",
        {
          user_id: "demo-user"
        }
      );

    const cart =
      result?.cart ||
      result?.structuredContent?.cart ||
      result?.content?.cart;

    if (cart) {
      renderCart(cart);
    }

  } catch (error) {

    console.error(
      "Cart error:",
      error
    );
  }
}


function renderCart(cart) {

  const container =
    document.getElementById(
      "cart"
    );

  container.style.display =
    cart?.items?.length
      ? "block"
      : "none";

  if (!cart?.items?.length) {
    return;
  }

  document.getElementById(
    "cartItems"
  ).innerHTML =
    cart.items.map(
      item => `
        <div
          style="
            display:flex;
            justify-content:space-between;
            margin-top:7px;
            font-size:12px;
          "
        >
          <span>
            ${escapeHtml(item.name)}
            × ${item.quantity}
          </span>

          <span>
            ₹${item.line_total}
          </span>
        </div>
      `
    ).join("");


  document.getElementById(
    "subtotal"
  ).textContent =
    `₹${cart.subtotal}`;


  document.getElementById(
    "delivery"
  ).textContent =
    `₹${cart.delivery_fee}`;


  document.getElementById(
    "total"
  ).textContent =
    `₹${cart.total}`;


  const payButton =
    document.getElementById(
      "payButton"
    );

  payButton.disabled =
    cart.total <= 0;

  payButton.textContent =
    `Pay ₹${cart.total}`;

  payButton.onclick =
    createPayment;
}


async function createPayment() {

  const button =
    document.getElementById(
      "payButton"
    );

  button.disabled =
    true;

  button.textContent =
    "Preparing payment...";

  try {

    const result =
      await window.openai.callTool(
        "create_payment_order",
        {
          user_id: "demo-user"
        }
      );

    if (
      result?.isError ||
      result?.success === false
    ) {

      throw new Error(
        result?.error ||
        "Could not create payment"
      );
    }

    const data =
      result?.structuredContent ||
      result;

    const paymentUrl =
      data.payment_url;

    if (!paymentUrl) {

      throw new Error(
        "Payment URL was not returned."
      );
    }

    // Apps SDK host helper.
    if (
      typeof window.openai?.openExternal ===
      "function"
    ) {

      await window.openai.openExternal({
        href: paymentUrl
      });

    } else {

      window.open(
        paymentUrl,
        "_blank"
      );
    }

    button.disabled =
      false;

    button.textContent =
      "Pay";

  } catch (error) {

    console.error(
      error
    );

    showToast(
      error.message ||
      "Payment could not be started."
    );

    button.disabled =
      false;
  }
}


function renderProducts() {

  const list =
    products();

  const title =
    output().title ||
    output().query ||
    "QuickCart";


  document.getElementById(
    "title"
  ).textContent =
    title;


  document.getElementById(
    "count"
  ).textContent =
    `${list.length} ${
      list.length === 1
        ? "product"
        : "products"
    }`;


  const container =
    document.getElementById(
      "products"
    );


  if (!list.length) {

    container.innerHTML = `
      <div class="empty">
        No products found.
      </div>
    `;

    return;
  }


  container.innerHTML =
    list.map(
      product => {

        const id =
          escapeHtml(product.id);

        const name =
          escapeHtml(product.name);

        const brand =
          escapeHtml(product.brand);

        const image =
          escapeHtml(product.image);

        return `
          <div class="product">

            <div class="image">
              <img
                src="${image}"
                alt="${name}"
              />
            </div>

            <div class="details">

              <div class="name">
                ${name}
              </div>

              <div class="brand">
                ${brand}
              </div>

              <div class="meta">

                <span class="rating">
                  ★ ${product.rating}
                </span>

                <span>
                  ${escapeHtml(product.unit)}
                </span>

                <span>
                  ${
                    Number(product.stock) > 0
                      ? "In stock"
                      : "Out of stock"
                  }
                </span>

              </div>

              <div class="pricing">

                <span class="price">
                  ₹${product.price}
                </span>

                ${
                  product.mrp >
                  product.price
                    ? `
                      <span class="mrp">
                        ₹${product.mrp}
                      </span>
                    `
                    : ""
                }

                ${
                  Number(product.discount) > 0
                    ? `
                      <span class="discount">
                        ${product.discount}% OFF
                      </span>
                    `
                    : ""
                }

              </div>

            </div>

            <button
              class="add"
              data-id="${id}"
              ${
                Number(product.stock) <= 0
                  ? "disabled"
                  : ""
              }
            >
              ${
                Number(product.stock) > 0
                  ? "Add"
                  : "Sold out"
              }
            </button>

          </div>
        `;
      }
    ).join("");


  container
    .querySelectorAll(".add")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const id =
            button.dataset.id;

          if (id) {
            addToCart(id);
          }

        }
      );

    });
}


renderProducts();

refreshCart();


window.addEventListener(
  "openai:set_globals",
  () => {

    renderProducts();

    refreshCart();

  }
);

</script>

</body>
</html>
