<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
/>

<title>QuickCart</title>

<style>

:root {
  --bg: #fff;
  --card: #fff;
  --text: #111;
  --muted: #707070;
  --border: #e8e8e8;
  --soft: #f6f6f6;
  --green: #087443;
  --red: #b42318;
  --button: #111;
  --buttonText: #fff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 14px;

  background: var(--bg);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Inter",
    "Segoe UI",
    sans-serif;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.title {
  font-size: 17px;
  font-weight: 750;
}

.count {
  font-size: 12px;
  color: var(--muted);
}

.agent {
  display: flex;
  gap: 8px;
  padding: 10px;

  margin-bottom: 12px;

  border-radius: 13px;
  background: var(--soft);
  border: 1px solid var(--border);
}

.agent-icon {
  font-size: 22px;
}

.agent-info {
  min-width: 0;
}

.agent-name {
  font-weight: 750;
  font-size: 13px;
}

.agent-status {
  margin-top: 2px;
  font-size: 11px;
  color: var(--green);
}

.agent-spend {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}

.products {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.product {
  display: grid;

  grid-template-columns:
    72px minmax(0, 1fr) auto;

  gap: 11px;

  padding: 8px;

  align-items: center;

  border: 1px solid var(--border);
  border-radius: 14px;
}

.image {
  width: 72px;
  height: 72px;

  overflow: hidden;
  border-radius: 11px;

  background: var(--soft);
}

.image img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.details {
  min-width: 0;
}

.name {
  font-size: 14px;
  font-weight: 700;
}

.brand {
  color: var(--muted);
  font-size: 11px;
}

.meta {
  display: flex;
  gap: 7px;

  margin-top: 5px;

  color: var(--muted);
  font-size: 11px;
}

.rating {
  color: #d09500;
  font-weight: 700;
}

.price {
  margin-top: 5px;
  font-weight: 800;
  font-size: 15px;
}

.add {
  border: 0;
  border-radius: 9px;

  padding: 8px 12px;

  background: var(--button);
  color: var(--buttonText);

  font-size: 12px;
  font-weight: 700;

  cursor: pointer;
}

.add:disabled {
  opacity: .5;
}

.panel {
  margin-top: 12px;

  padding: 13px;

  border: 1px solid var(--border);
  border-radius: 14px;

  background: var(--soft);
}

.panel-title {
  font-size: 13px;
  font-weight: 750;
}

.row {
  display: flex;
  justify-content: space-between;

  margin-top: 6px;

  font-size: 12px;
  color: var(--muted);
}

.total {
  color: var(--text);
  font-weight: 800;
}

.badge {
  display: inline-block;

  margin-top: 8px;

  padding: 4px 8px;

  border-radius: 999px;

  font-size: 10px;
  font-weight: 700;

  background: #dff6e8;
  color: var(--green);
}

.blocked {
  background: #fde8e7;
  color: var(--red);
}

.empty {
  padding: 28px;

  text-align: center;

  color: var(--muted);

  font-size: 13px;
}

.toast {
  position: fixed;

  left: 50%;
  bottom: 12px;

  transform: translateX(-50%);

  padding: 8px 13px;

  border-radius: 999px;

  background: #111;
  color: #fff;

  font-size: 12px;

  opacity: 0;

  pointer-events: none;

  transition: opacity .15s ease;
}

.toast.visible {
  opacity: 1;
}

</style>
</head>

<body>

<div class="header">

  <div
    id="title"
    class="title"
  >
    QuickCart
  </div>

  <div
    id="count"
    class="count"
  >
    0 products
  </div>

</div>


<div
  class="agent"
>

  <div class="agent-icon">
    🤖
  </div>

  <div class="agent-info">

    <div class="agent-name">
      Grocery Autopilot
    </div>

    <div class="agent-status">
      ● Autonomous purchasing ON
    </div>

    <div
      id="agentSpend"
      class="agent-spend"
    >
      Daily limit ₹50,000
    </div>

  </div>

</div>


<div
  id="products"
  class="products"
></div>


<div
  id="result"
  class="panel"
  style="display:none"
></div>


<div
  id="toast"
  class="toast"
></div>


<script>

function toolOutput() {
  return (
    window.openai?.toolOutput || {}
  );
}


function escapeHtml(
  value
) {
  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function toast(
  message
) {

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "visible"
  );

  setTimeout(
    () => {
      element.classList.remove(
        "visible"
      );
    },
    1800
  );
}


async function addToCart(
  productId
) {

  const result =
    await window.openai.callTool(
      "add_to_cart",
      {
        product_id: productId,
        quantity: 1,
        user_id: "demo-user"
      }
    );

  if (
    result?.success === false
  ) {

    toast(
      result.error ||
      "Could not add product"
    );

    return;
  }

  toast(
    "Added to cart"
  );
}


async function showAgent() {

  try {

    const result =
      await window.openai.callTool(
        "get_agent_policy",
        {
          agent_id:
            "agent_demo_grocery"
        }
      );

    const data =
      result?.agent ||
      result?.structuredContent?.agent;

    const policy =
      result?.policy ||
      result?.structuredContent?.policy;

    const spend =
      result?.spend_today ??
      result?.structuredContent?.spend_today ??
      0;

    if (!policy) {
      return;
    }

    document.getElementById(
      "agentSpend"
    ).textContent =
      `₹${spend} spent / ₹${policy.daily_limit} today`;

  } catch (error) {

    console.error(
      "Agent UI:",
      error
    );
  }
}


function render() {

  const output =
    toolOutput();

  const list =
    Array.isArray(
      output.products
    )
      ? output.products
      : [];

  const title =
    output.title ||
    output.query ||
    "QuickCart";


  document.getElementById(
    "title"
  ).textContent =
    title;


  document.getElementById(
    "count"
  ).textContent =
    `${list.length} ${
      list.length === 1
        ? "product"
        : "products"
    }`;


  const container =
    document.getElementById(
      "products"
    );


  if (!list.length) {

    container.innerHTML =
      `<div class="empty">
         No products found.
       </div>`;

    return;
  }


  container.innerHTML =
    list.map(
      product => `

      <div class="product">

        <div class="image">

          <img
            src="${escapeHtml(product.image)}"
            alt="${escapeHtml(product.name)}"
          >

        </div>


        <div class="details">

          <div class="name">
            ${escapeHtml(product.name)}
          </div>

          <div class="brand">
            ${escapeHtml(product.brand)}
          </div>

          <div class="meta">

            <span class="rating">
              ★ ${product.rating}
            </span>

            <span>
              ${escapeHtml(product.unit)}
            </span>

            <span>
              ${
                Number(product.stock) > 0
                  ? "In stock"
                  : "Out"
              }
            </span>

          </div>

          <div class="price">
            ₹${product.price}
          </div>

        </div>


        <button
          class="add"
          data-id="${escapeHtml(product.id)}"
          ${
            Number(product.stock) <= 0
              ? "disabled"
              : ""
          }
        >
          Add
        </button>

      </div>

    `
    ).join("");


  container
    .querySelectorAll(".add")
    .forEach(
      button => {

        button.onclick =
          () => {

            addToCart(
              button.dataset.id
            );

          };

      }
    );
}


render();
showAgent();


window.addEventListener(
  "openai:set_globals",
  () => {
    render();
    showAgent();
  }
);

</script>

</body>
</html>
