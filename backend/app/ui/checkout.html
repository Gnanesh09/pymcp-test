<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Umon Mart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            font-family: Poppins, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #111827;
            background: #f7f8fb;
            color-scheme: light;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: linear-gradient(180deg, #fbfcfe 0%, #f5f7fb 100%);
            color: #111827
        }

        .shell {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            padding: 8px
        }

        .card {
            background: #fff;
            border: 1px solid #e8ecf2;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .055)
        }

        .head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 13px;
            border-bottom: 1px solid #eef1f5
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0
        }

        .logo {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            background: #111827;
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            flex: 0 0 auto
        }

        .kicker {
            font-size: 7px;
            line-height: 1;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 800
        }

        .title {
            margin-top: 3px;
            font-size: 13px;
            line-height: 1.2;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .subtitle {
            margin-top: 2px;
            font-size: 8.5px;
            line-height: 1.3;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 7px;
            border-radius: 999px;
            font-size: 7.5px;
            font-weight: 800;
            white-space: nowrap;
            background: #f1f5f9;
            color: #475569
        }

        .badge.ok {
            background: #ecfdf5;
            color: #047857
        }

        .badge.warn {
            background: #fffbeb;
            color: #b45309
        }

        .badge.bad {
            background: #fef2f2;
            color: #b91c1c
        }

        .body {
            padding: 11px 13px
        }

        .notice {
            padding: 8px 10px;
            border: 1px solid #edf1f5;
            background: #f8fafc;
            border-radius: 11px;
            color: #64748b;
            font-size: 8.5px;
            line-height: 1.45;
            margin-bottom: 9px
        }

        .notice strong {
            color: #334155
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px
        }

        .product {
            display: flex;
            gap: 9px;
            min-width: 0;
            padding: 7px;
            border: 1px solid #e8edf3;
            border-radius: 12px;
            background: #fff
        }

        .product:hover {
            border-color: #dbe2eb;
            box-shadow: 0 5px 15px rgba(15, 23, 42, .05)
        }

        .thumb {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 10px;
            overflow: hidden;
            background: #f1f5f9;
            flex: 0 0 64px
        }

        .thumb img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover
        }

        .fallback {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #f3f4f6, #eef2ff);
            font-size: 18px;
            font-weight: 800;
            color: #64748b
        }

        .content {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .name {
            font-size: 9px;
            font-weight: 800;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .meta {
            margin-top: 2px;
            font-size: 7.2px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .price-line {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-top: 4px
        }

        .price {
            font-size: 10px;
            font-weight: 800
        }

        .mrp {
            font-size: 7px;
            color: #94a3b8;
            text-decoration: line-through
        }

        .save {
            font-size: 6.8px;
            color: #047857;
            font-weight: 800
        }

        .reason {
            margin-top: 3px;
            font-size: 7px;
            line-height: 1.35;
            color: #64748b;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .source {
            margin-top: 3px;
            font-size: 6.8px;
            font-weight: 700;
            color: #0f766e
        }

        .add {
            margin-top: 5px;
            width: max-content;
            border: 0;
            border-radius: 8px;
            background: #111827;
            color: #fff;
            padding: 5px 8px;
            font: 700 7.5px Poppins, sans-serif;
            cursor: pointer
        }

        .add:disabled {
            opacity: .55;
            cursor: default
        }

        .section {
            margin-top: 10px
        }

        .section-title {
            font-size: 8.5px;
            font-weight: 800;
            margin-bottom: 6px
        }

        .gap {
            padding: 7px 8px;
            margin-top: 4px;
            border: 1px solid #ffedd5;
            background: #fff7ed;
            border-radius: 9px;
            color: #9a3412;
            font-size: 7.5px;
            line-height: 1.4
        }

        .rows {
            display: flex;
            flex-direction: column
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 7px 0;
            border-bottom: 1px solid #f0f2f5;
            font-size: 8.5px
        }

        .row:last-child {
            border-bottom: 0
        }

        .muted {
            color: #64748b
        }

        .strong {
            font-weight: 800
        }

        .total {
            font-size: 11px;
            font-weight: 800
        }

        .item {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0
        }

        .item-img {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            object-fit: cover;
            background: #f1f5f9;
            flex: 0 0 30px
        }

        .item-name {
            font-weight: 700;
            font-size: 8.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .mini {
            margin-top: 1px;
            font-size: 6.8px;
            color: #94a3b8
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 8px
        }

        .stat {
            padding: 7px 8px;
            border: 1px solid #e9edf2;
            border-radius: 10px;
            background: #fafbfd
        }

        .stat-k {
            font-size: 6.8px;
            color: #94a3b8
        }

        .stat-v {
            margin-top: 2px;
            font-size: 9px;
            font-weight: 800
        }

        .decision {
            padding: 8px 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 8px;
            line-height: 1.45
        }

        .decision.ok {
            background: #ecfdf5;
            color: #065f46
        }

        .decision.warn {
            background: #fffbeb;
            color: #92400e
        }

        .decision.bad {
            background: #fef2f2;
            color: #991b1b
        }

        .foot {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 6.8px;
            line-height: 1.4
        }

        .empty {
            text-align: center;
            padding: 28px 10px;
            color: #64748b;
            font-size: 8.5px
        }

        @media(max-width:560px) {
            .grid {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

</style>
</head>

<body>
    <div class="shell">
        <div id="root" class="card">
            <div class="empty">Loading checkout review…</div>
        </div>
    </div>
    <script type="module">
        import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.1.2/app-with-deps";
        const app = new App({ name: "Umon Mart", version: "1.0.0" }); const root = document.getElementById("root");
        const esc = v => String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
        const money = p => `₹${(Number(p || 0) / 100).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        function unwrap(r) { if (!r) return {}; if (r.structuredContent && typeof r.structuredContent === "object") return r.structuredContent; const t = Array.isArray(r.content) ? r.content.find(x => x?.type === "text" && typeof x.text === "string") : null; if (t) { try { const d = JSON.parse(t.text); if (d && typeof d === "object") return d } catch { } } return r.data && typeof r.data === "object" ? r.data : r }
        function render(r) {
            const d = unwrap(r), c = d.checkout || d, p = c.policy || d.policy || {}, decision = p.decision || c.decision || "BLOCK";
            const cls = decision === "ALLOW" ? "ok" : decision === "CONFIRM" ? "warn" : "bad";
            const cart = c.cart || {}; const agent = c.agent || {};
            const amount = cart.total_paise ?? c.amount_paise ?? 0;
            root.innerHTML = `<div class="head"><div class="brand"><div class="logo">U</div><div><div class="kicker">Checkout review</div><div class="title">Review before payment</div><div class="subtitle">Authoritative Umon decision · read-only</div></div></div><span class="badge ${cls}">${esc(decision)}</span></div><div class="body"><div class="decision ${cls}"><strong>${esc(decision)}</strong><br>${esc(p.reason || p.message || c.next_step || "No money was moved.")}</div><div class="stats"><div class="stat"><div class="stat-k">Cart total</div><div class="stat-v">${money(amount)}</div></div><div class="stat"><div class="stat-k">Agent</div><div class="stat-v">${esc(agent.name || "—")}</div></div><div class="stat"><div class="stat-k">Available</div><div class="stat-v">${money(agent.balance_available_paise)}</div></div></div><div class="rows"><div class="row"><span class="muted">Transaction limit</span><span>${money(agent.policy?.max_transaction_paise)}</span></div><div class="row"><span class="muted">Daily remaining</span><span>${money(agent.policy?.daily_remaining_paise || d.agent_spending?.spending?.daily_remaining_paise)}</span></div><div class="row"><span class="muted">Money moved</span><span class="strong">No</span></div></div><div class="foot">${esc(c.next_step || "Only continue after clear user authorization. The backend remains authoritative.")}</div></div>`;
        }
        app.ontoolresult = render; app.onerror = () => root.innerHTML = '<div class="empty">Checkout review could not be loaded.</div>'; await app.connect();
    </script>
</body>

</html>
