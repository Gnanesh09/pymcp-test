<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umon Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:Poppins,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#111827;background:#f8fafc;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbfcfe 0%,#f5f7fb 100%);color:#111827}.shell{padding:14px;width:100%;max-width:820px;margin:auto}.card{background:#fff;border:1px solid #e8edf4;border-radius:20px;box-shadow:0 8px 28px rgba(15,23,42,.06);overflow:hidden}.head{padding:18px 20px 15px;border-bottom:1px solid #edf1f6;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.brand{display:flex;gap:11px;align-items:center}.logo{width:38px;height:38px;border-radius:11px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800}.kicker{font-size:10px;font-weight:700;letter-spacing:.13em;color:#94a3b8;text-transform:uppercase}.title{font-size:17px;font-weight:800;line-height:1.25}.subtitle{font-size:11px;color:#64748b;margin-top:2px}.badge{border-radius:999px;padding:6px 9px;font-size:10px;font-weight:700;background:#eef2f7;color:#475569;white-space:nowrap}.badge.ok{background:#ecfdf5;color:#047857}.body{padding:18px 20px}.intro{padding:12px 13px;border:1px solid #edf1f6;background:#fbfcfe;border-radius:14px;color:#475569;font-size:11px;line-height:1.55;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.product{border:1px solid #e8edf4;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}.media{aspect-ratio:1/1;background:#f1f5f9;position:relative;overflow:hidden}.media img{width:100%;height:100%;display:block;object-fit:cover}.fallback{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#eef2ff,#f8fafc);font-size:29px;font-weight:800;color:#64748b}.media.has-image .fallback{display:none}.media.image-failed img{display:none}.media.image-failed .fallback{display:grid}.body2{padding:12px}.name{font-size:12px;font-weight:700;line-height:1.4}.meta{font-size:10px;color:#64748b;margin-top:3px;min-height:15px}.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px}.price{font-size:14px;font-weight:800}.mrp{font-size:10px;color:#94a3b8;text-decoration:line-through}.reason{font-size:10px;line-height:1.45;color:#475569;margin-top:9px;min-height:30px}.source{margin-top:8px;font-size:9px;color:#0f766e;font-weight:600}.actions{display:flex;gap:7px;margin-top:10px}.btn{width:100%;border:0;border-radius:11px;padding:9px 10px;font:600 10px Poppins, sans-serif;cursor:pointer}.btn.primary{background:#111827;color:#fff}.btn.secondary{background:#f1f5f9;color:#334155}.btn:disabled{opacity:.55;cursor:default}.section{margin-top:17px}.section-title{font-size:11px;font-weight:700;margin-bottom:8px}.gap{padding:10px 11px;border-radius:12px;background:#fff7ed;color:#9a3412;font-size:10px;line-height:1.5;margin-top:6px}.foot{margin-top:12px;font-size:9px;color:#94a3b8}.empty{padding:36px 10px;text-align:center;color:#64748b;font-size:11px}.notice{padding:10px 11px;border-radius:12px;background:#f8fafc;color:#64748b;font-size:10px;margin-top:12px}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:430px){.grid{grid-template-columns:1fr}.head{padding:15px}.body{padding:15px}}
</style>
</head>
<body>
<div class="shell"><div id="root" class="card"><div class="empty">Loading Umon…</div></div></div>
<script type="module">
import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.1.2/app-with-deps";
const app=new App({name:"Umon Mart",version:"1.0.0"});
const root=document.getElementById('root');
const money=p=>`₹${(Number(p||0)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function dataOf(result){
  if(!result) return {};
  if(result.structuredContent&&typeof result.structuredContent==='object') return result.structuredContent;
  const block=Array.isArray(result.content)?result.content.find(x=>x?.type==='text'&&typeof x.text==='string'):null;
  if(block){try{const parsed=JSON.parse(block.text);if(parsed&&typeof parsed==='object')return parsed}catch(e){}}
  return result.data&&typeof result.data==='object'?result.data:result;
}
function fallbackLetter(name){return esc((name||'U').trim().charAt(0).toUpperCase());}
async function add(productId,button){
  if(!productId)return;
  button.disabled=true;button.textContent='Adding…';
  try{
    const result=await app.callServerTool({name:'add_to_cart',arguments:{product_id:productId,quantity:1}});
    const data=dataOf(result);
    if(data.success===false) throw new Error(data.error?.message||data.message||'Could not add item');
    button.textContent='Added';
    const notice=document.getElementById('notice');
    if(notice) notice.textContent='Added to your shared cart. Payment is still user-controlled.';
  }catch(e){
    console.error(e);button.disabled=false;button.textContent='Add to cart';
    const notice=document.getElementById('notice'); if(notice) notice.textContent=e.message||'Could not add that item.';
  }
}
window.umonAdd=add;
function imageMarkup(p){
  if(!p.image)return `<div class="fallback">${fallbackLetter(p.name)}</div>`;
  return `<img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.classList.add('image-failed')"><div class="fallback">${fallbackLetter(p.name)}</div>`;
}
function render(result){
  const d=dataOf(result);
  const items=d.suggestions||d.recommendations||d.products||d.cross_sell||[];
  const title=d.title||'Smart recommendations';
  const subtitle=d.intent||'Based on your current shopping goal';
  root.innerHTML=`<div class="head"><div class="brand"><div class="logo">U</div><div><div class="kicker">Umon Mart</div><div class="title">${esc(title)}</div><div class="subtitle">${esc(subtitle)}</div></div></div><span class="badge ok">${items.length} verified</span></div><div class="body"><div id="notice" class="intro">${esc(d.explanation||'These recommendations use current Umon catalogue data. Nothing was added or purchased automatically.')}</div>${items.length?`<div class="grid">${items.map(p=>`<article class="product"><div class="media${p.image?' has-image':''}">${imageMarkup(p)}</div><div class="body2"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.brand||p.category||'')}</div><div class="price-row"><div class="price">${money(p.price_paise)}</div>${Number(p.mrp_paise||0)>Number(p.price_paise||0)?`<div class="mrp">${money(p.mrp_paise)}</div>`:''}</div><div class="reason">${esc(p.recommendation_reason||p.reason||'Relevant to your request.')}</div>${p.recommendation_source?`<div class="source">${esc(p.recommendation_source==='MERCHANT_CROSS_SELL'?'Merchant cross-sell':'Catalogue match')}</div>`:''}<div class="actions"><button class="btn primary" onclick="window.umonAdd('${esc(p.id)}',this)">Add to cart</button></div></div></article>`).join('')}</div>`:`<div class="empty">No verified recommendations are available from the current Umon catalogue.</div>`}${(d.basket_gaps||[]).length?`<div class="section"><div class="section-title">Not confirmed in Umon</div>${d.basket_gaps.map(g=>`<div class="gap">${esc(g)}</div>`).join('')}</div>`:''}<div class="foot">Recommendations only · no money moved</div></div>`;
}
app.ontoolresult=render;
app.onerror=e=>{root.innerHTML='<div class="empty">Umon could not load this view. Please retry.</div>';console.error(e)};
await app.connect();
</script>
</body></html>
