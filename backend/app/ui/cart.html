<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umon Cart</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{font-family:Poppins,sans-serif;color:#111827;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f7f9fc}.shell{max-width:820px;margin:auto;padding:14px}.card{background:white;border:1px solid #e7ecf3;border-radius:20px;overflow:hidden;box-shadow:0 8px 28px rgba(15,23,42,.06)}.head{padding:17px 19px;border-bottom:1px solid #edf1f5;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:11px;background:#111827;color:white;display:grid;place-items:center;font-weight:800}.kicker{font-size:10px;letter-spacing:.13em;color:#94a3b8;font-weight:700;text-transform:uppercase}.title{font-size:16px;font-weight:800}.sub{font-size:10px;color:#64748b}.badge{font-size:10px;font-weight:700;padding:6px 9px;border-radius:999px;background:#eef2f7;color:#475569}.body{padding:17px 19px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid #f0f3f7}.name{font-size:12px;font-weight:700}.meta{font-size:10px;color:#64748b;margin-top:2px}.price{font-size:12px;font-weight:700;text-align:right}.row{display:flex;justify-content:space-between;padding:9px 0;font-size:11px;color:#64748b}.row.total{font-size:16px;font-weight:800;color:#111827;border-top:1px solid #edf1f5;margin-top:5px;padding-top:14px}.empty{text-align:center;padding:35px 10px;color:#64748b;font-size:11px}.notice{margin-top:13px;padding:10px 11px;background:#f8fafc;border-radius:12px;color:#64748b;font-size:10px;line-height:1.5}</style></head><body><div class="shell"><div id="root" class="card"><div class="empty">Loading Umon cart…</div></div></div><script type="module">import{App}from"https://unpkg.com/@modelcontextprotocol/ext-apps@1.1.2/app-with-deps";const app=new App({name:"Umon Mart",version:"1.0.0"}),root=document.getElementById('root');const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'),money=p=>`₹${(Number(p||0)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}`;function dataOf(r){if(r?.structuredContent&&typeof r.structuredContent==='object')return r.structuredContent;const b=Array.isArray(r?.content)?r.content.find(x=>x?.type==='text'&&typeof x.text==='string'):null;if(b){try{return JSON.parse(b.text)}catch{}}return r?.data||r||{}}function render(r){const d=dataOf(r),c=d.cart||{},items=c.items||[];root.innerHTML=`<div class="head"><div class="brand"><div class="logo">U</div><div><div class="kicker">Umon Mart</div><div class="title">Your shared cart</div><div class="sub">Same cart, regardless of payment agent</div></div></div><span class="badge">${items.length} items</span></div><div class="body">${items.length?items.map(i=>`<div class="item"><div><div class="name">${esc(i.name)} × ${esc(i.quantity)}</div><div class="meta">${esc(i.unit||i.category||'')}</div></div><div class="price">${money(i.line_total_paise)}</div></div>`).join(''):'<div class="empty">Your cart is empty.</div>'}<div class="row"><span>Subtotal</span><strong>${money(c.subtotal_paise)}</strong></div><div class="row"><span>Delivery</span><strong>${money(c.delivery_fee_paise)}</strong></div><div class="row total"><span>Total</span><span>${money(c.total_paise)}</span></div><div class="notice">Cart totals are read from Umon. Payment and agent selection happen separately at checkout.</div></div>`}app.ontoolresult=render;app.onerror=()=>root.innerHTML='<div class="empty">Umon cart UI could not load. Please retry.</div>';await app.connect();</script></body></html>
